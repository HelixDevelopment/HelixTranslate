run:
  timeout: 5m
  tests: true

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow
  gocyclo:
    min-complexity: 35
  dupl:
    threshold: 100
  goconst:
    min-len: 2
    min-occurrences: 2
  misspell:
    locale: US
  lll:
    line-length: 140
  goimports:
    local-prefixes: digital.vasic.translator
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - wrapperFunc
  funlen:
    lines: 150
    statements: 120
  gocognit:
    min-complexity: 20
  nestif:
    min-complexity: 4
  errcheck:
    check-type-assertions: false
    check-blank: false
    exclude-functions:
      - (*os.File).Close
      - (*io.ReadCloser).Close
      - (io.Closer).Close
      - (*sql.Rows).Close
      - (*sql.DB).Close
      - (*sql.Stmt).Close
      - (*zip.Writer).Close
      - (net.Conn).Close
      - (*ssh.Session).Close
      - (*ssh.Session).Signal
      - os.Remove
      - os.RemoveAll
      - os.MkdirAll
      - os.File.Close
      - io.WriteString
      - fmt.Fprintf
      - fmt.Fprintln
      - fmt.Fprint
      - json.Unmarshal
      - rand.Read
      - (*os.File).WriteString
      - (*os.File).Seek
      - (*ssh.Client).Close
      - (*sshworker.SSHWorker).Disconnect
      - (*distributed.VersionManager).rollbackWorkerUpdate
      - (*models.Downloader).Close
      - (*batch.BatchProcessor).Close
      - (*batch.BatchProcessor).database.SaveNote
      - (*sql.Tx).Rollback
      - (*zip.Writer).Close
      - (*sftp.Client).Close
      - (*epub.EPUBWriter).Close
      - (*epub.EPUBReader).Close
      - (*markdown.EPUBToMarkdownConverter).Close
      - (*markdown.MarkdownToEPUBConverter).Close
      - (*verification.VerificationDatabase).Close
      - (*verification.MultiPassProcessor).database.SaveNote
      - (*translator.TranslationWorker).Close
      - (*events.EventBus).Unsubscribe
      - (*events.EventBus).Publish
      - (*distributed.SSHPool).Close
  gosec:
    excludes:
      - G104
      - G106
      - G112
      - G114
      - G115
      - G204
      - G301
      - G302
      - G304
      - G306
      - G402

linters:
  disable-all: true
  enable:
    - bodyclose
    - dogsled
    - forbidigo
    - funlen
    - gochecknoinits
    - gocyclo
    - gofmt
    - gosec
    - gosimple
    - govet
    - ineffassign
    - makezero
    - nakedret
    - nolintlint
    - rowserrcheck
    - staticcheck
    - typecheck
    - unconvert
    - unused


issues:
  exclude-rules:
    - path: '.*_test.*\.go$'
      linters:
        - funlen
        - gomnd
        - goconst
        - dupl
        - errcheck
        - gosec
        - govet
        - gocyclo
        - nestif
        - lll
        - forcetypeassert
        - unparam
        - staticcheck
        - gosimple
        - unused
        - bodyclose
        - ineffassign
    - path: cmd/
      linters:
        - funlen
        - gochecknoinits
        - forbidigo
        - depguard
        - govet
        - gocyclo
        - nestif
        - lll
        - forcetypeassert
        - errcheck
    - path: pkg/
      linters:
        - gochecknoinits
    - path: tools/
      linters:
        - forbidigo
        - depguard
        - godot
        - gosec
        - errcheck
        - gocritic
        - revive
        - stylecheck
        - govet
        - gocyclo
        - nestif
        - lll
        - funlen
    - path: build/
      linters:
        - forbidigo
        - depguard
        - godot
        - gosec
        - errcheck
        - gocritic
        - revive
        - stylecheck
        - gocyclo
        - nilerr
    - path: test/
      linters:
        - errcheck
        - gosec
        - forbidigo
        - bodyclose
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
